name: Sync from upstream

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout demo repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git fetch https://github.com/abdullah0096/crack_d.git master:refs/remotes/upstream/master

      - name: Sync main with upstream master
        run: |
          git config user.name "Aditya Gowari"
          git config user.email "nkadityagowari@gmail.com"
          git checkout main
          git merge upstream/master --no-edit --allow-unrelated-histories
          git push origin main