trees:
  section_order: 8
  problems:
    - { lc_num: 104, name: "Maximum Depth of Binary Tree",                                          slug: "maximum-depth-of-binary-tree",                                          url: "https://leetcode.com/problems/maximum-depth-of-binary-tree/",                                          difficulty: Easy,   tier: 1, ramp_pos: 1,  twist: "primer: tree recursion returning a value from children", tracks: ["google_focused"] }
