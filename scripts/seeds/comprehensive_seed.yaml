  problems:
    - { lc_num: 206, name: "Reverse Linked List",                       slug: "reverse-linked-list",                       url: "https://leetcode.com/problems/reverse-linked-list/",                       difficulty: Easy,   tier: 1, ramp_pos: 1, twist: "primer: 3-pointer rewiring (prev, curr, next)", tracks: ["google_focused"] }
