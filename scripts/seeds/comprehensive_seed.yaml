    - { lc_num: 141, name: "Linked List Cycle",                          slug: "linked-list-cycle",                          url: "https://leetcode.com/problems/linked-list-cycle/",                          difficulty: Easy,   tier: 1, ramp_pos: 3, twist: "Floyd's tortoise-and-hare primer for cycle detection", tracks: ["google_focused"] }
    - { lc_num: 142, name: "Linked List Cycle II",                       slug: "linked-list-cycle-ii",                       url: "https://leetcode.com/problems/linked-list-cycle-ii/",                       difficulty: Medium, tier: 2, ramp_pos: 4, twist: "extend Floyd's with the meeting-point → start-of-cycle math", tracks: [] }
    - { lc_num: 19,  name: "Remove Nth Node From End of List",            slug: "remove-nth-node-from-end-of-list",            url: "https://leetcode.com/problems/remove-nth-node-from-end-of-list/",            difficulty: Medium, tier: 2, ramp_pos: 5, twist: "two pointers separated by a fixed gap of N", tracks: [] }
    - { lc_num: 143, name: "Reorder List",                                slug: "reorder-list",                                url: "https://leetcode.com/problems/reorder-list/",                                difficulty: Medium, tier: 2, ramp_pos: 6, twist: "composite: find-mid + reverse-second-half + interleave-merge", tracks: ["google_focused"] }
    - { lc_num: 138, name: "Copy List with Random Pointer",                slug: "copy-list-with-random-pointer",                url: "https://leetcode.com/problems/copy-list-with-random-pointer/",                difficulty: Medium, tier: 2, ramp_pos: 7, twist: "old→new node map (or interleave trick) to resolve random refs", tracks: [] }
    - { lc_num: 146, name: "LRU Cache",                                   slug: "lru-cache",                                   url: "https://leetcode.com/problems/lru-cache/",                                   difficulty: Medium, tier: 3, ramp_pos: 8, twist: "design: hashmap + doubly-linked list for O(1) get and put", tracks: ["google_focused"] }
    - { lc_num: 23,  name: "Merge K Sorted Lists",                         slug: "merge-k-sorted-lists",                         url: "https://leetcode.com/problems/merge-k-sorted-lists/",                         difficulty: Hard,   tier: 3, ramp_pos: 9, twist: "min-heap over k head pointers (or divide-and-conquer pairwise merge)", tracks: ["google_focused"] }

# =============================================================================
# 8. TREES (binary tree DFS/BFS; BST has its own section)
# =============================================================================
# Pedagogical arc:
#   recursion primer → mutating recursion → augmented return
#   → augmented return (compute one, return another) → BFS primer
#   → BFS variant → DFS + backtracking on tree → "found" recursion
#   → reconstruction → in-place restructure → tree DP intro → tree DP capstone
