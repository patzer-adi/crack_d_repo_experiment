# PLAN-012 — Comprehensive Problem List Seed
#
# Single source of truth for the merge into data/problems.json.
# Each section is a difficulty ramp (PLAN-012 §4.5): each problem after the
# first introduces ONE new twist over its predecessor. Sorting by
# ramp_pos within a section yields the intended study order.
#
# Schema per problem:
#   lc_num   : LeetCode number
#   name     : Problem name
#   slug     : LeetCode URL slug ("" if NeetCode-only)
#   url      : Problem URL
#   difficulty: Easy | Medium | Hard
#   tier     : 1=foundational primer, 2=core interview-shaped, 3=advanced/capstone
#   ramp_pos : 1-indexed position in this section's ramp
#   twist    : ≤120 chars — the ONE new concept this problem introduces vs the prior step
#   tracks   : list, includes "google_focused" if listed in the original google sheet
#
# Sections in canonical order (per PLAN-012 §4.3):
#   1.  Arrays & Hashing
#   2.  Two Pointers
#   3.  Sliding Window
#   4.  Prefix Sum
#   5.  Binary Search
#   6.  Stack & Monotonic Stack
#   7.  Linked Lists
#   8.  Trees
#   9.  BST
#   10. Heaps / Priority Queue
#   11. Graphs — BFS / DFS
#   12. Graphs — Advanced
#   13. Dynamic Programming
#   14. Backtracking
#   15. Greedy / Intervals
#   16. Tries
#   17. Bit Manipulation
#   18. Math
#   19. String Matching
#   20. Design
#
# Note: there is no "Ad-hoc / Signature" section. Per checkpoint-1 decision,
# Google signature problems (489, 715, 1146, 681, 359, 904, 388) are distributed
# into their natural pattern sections.

# =============================================================================
# 1. ARRAYS & HASHING
# =============================================================================
# Pedagogical arc:
#   set-membership → hash-for-complement → hash-with-computed-key
#   → set + skip-non-starts → counting/voting → prefix/suffix accumulators
#   → in-place tricks → matrix in-place → cycle-on-indices → index-as-hash
arrays_and_hashing:
  section_order: 1
  problems:
    - { lc_num: 217, name: "Contains Duplicate",                slug: "contains-duplicate",                url: "https://leetcode.com/problems/contains-duplicate/",                difficulty: Easy,   tier: 1, ramp_pos: 1,  twist: "set membership — the primer for using a hash structure", tracks: ["google_focused"] }
    - { lc_num: 1,   name: "Two Sum",                            slug: "two-sum",                            url: "https://leetcode.com/problems/two-sum/",                            difficulty: Easy,   tier: 1, ramp_pos: 2,  twist: "store complement → O(n) lookup instead of O(n²) pair check", tracks: ["google_focused"] }
    - { lc_num: 49,  name: "Group Anagrams",                     slug: "group-anagrams",                     url: "https://leetcode.com/problems/group-anagrams/",                     difficulty: Medium, tier: 1, ramp_pos: 3,  twist: "hash key is a *computed* canonical form (sorted str or count tuple)", tracks: [] }
    - { lc_num: 128, name: "Longest Consecutive Sequence",       slug: "longest-consecutive-sequence",       url: "https://leetcode.com/problems/longest-consecutive-sequence/",       difficulty: Medium, tier: 2, ramp_pos: 4,  twist: "skip non-start elements (n-1 ∈ set) to keep total work O(n)", tracks: ["google_focused"] }
    - { lc_num: 169, name: "Majority Element",                   slug: "majority-element",                   url: "https://leetcode.com/problems/majority-element/",                   difficulty: Easy,   tier: 2, ramp_pos: 5,  twist: "Boyer-Moore voting — O(1) space alternative to counting", tracks: ["google_focused"] }
    - { lc_num: 229, name: "Majority Element II",                slug: "majority-element-ii",                url: "https://leetcode.com/problems/majority-element-ii/",                difficulty: Medium, tier: 2, ramp_pos: 6,  twist: "generalise voting to k=2 candidates for n/3 threshold", tracks: ["google_focused"] }
    - { lc_num: 238, name: "Product of Array Except Self",       slug: "product-of-array-except-self",       url: "https://leetcode.com/problems/product-of-array-except-self/",       difficulty: Medium, tier: 2, ramp_pos: 7,  twist: "two passes carrying prefix and suffix accumulators — no division", tracks: ["google_focused"] }
    - { lc_num: 75,  name: "Sort Colors",                        slug: "sort-colors",                        url: "https://leetcode.com/problems/sort-colors/",                        difficulty: Medium, tier: 2, ramp_pos: 8,  twist: "Dutch National Flag — 3-way in-place partition", tracks: [] }
    - { lc_num: 48,  name: "Rotate Image",                       slug: "rotate-image",                       url: "https://leetcode.com/problems/rotate-image/",                       difficulty: Medium, tier: 2, ramp_pos: 9,  twist: "in-place matrix transform via transpose + row-reverse", tracks: [] }
    - { lc_num: 54,  name: "Spiral Matrix",                      slug: "spiral-matrix",                      url: "https://leetcode.com/problems/spiral-matrix/",                      difficulty: Medium, tier: 2, ramp_pos: 10, twist: "boundary-shrinking traversal with 4 walls", tracks: [] }
    - { lc_num: 73,  name: "Set Matrix Zeroes",                  slug: "set-matrix-zeroes",                  url: "https://leetcode.com/problems/set-matrix-zeroes/",                  difficulty: Medium, tier: 2, ramp_pos: 11, twist: "use the first row/col as O(1) marker storage", tracks: [] }
    - { lc_num: 287, name: "Find the Duplicate Number",          slug: "find-the-duplicate-number",          url: "https://leetcode.com/problems/find-the-duplicate-number/",          difficulty: Medium, tier: 3, ramp_pos: 12, twist: "Floyd's cycle detection — treat array as a function i → nums[i]", tracks: [] }
    - { lc_num: 41,  name: "First Missing Positive",             slug: "first-missing-positive",             url: "https://leetcode.com/problems/first-missing-positive/",             difficulty: Hard,   tier: 3, ramp_pos: 13, twist: "index-as-hash: in-place sign marking to encode presence", tracks: ["google_focused"] }

# =============================================================================
# 2. TWO POINTERS
# =============================================================================
# Pedagogical arc:
#   converging pointers with skip → read/write (fast/slow)
#   → converge to target → decision rule for which side to move
#   → outer-fix + inner-2ptr + dedup → state-carrying pointers
two_pointers:
  section_order: 2
  problems:
    - { lc_num: 125, name: "Valid Palindrome",                   slug: "valid-palindrome",                   url: "https://leetcode.com/problems/valid-palindrome/",                   difficulty: Easy,   tier: 1, ramp_pos: 1, twist: "primer: two ends converge; skip non-alphanumeric chars", tracks: ["google_focused"] }
    - { lc_num: 283, name: "Move Zeroes",                        slug: "move-zeroes",                        url: "https://leetcode.com/problems/move-zeroes/",                        difficulty: Easy,   tier: 1, ramp_pos: 2, twist: "read pointer + write pointer (fast/slow) for in-place filter", tracks: ["google_focused"] }
    - { lc_num: 167, name: "Two Sum II — Input Array Is Sorted", slug: "two-sum-ii-input-array-is-sorted",   url: "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/",   difficulty: Medium, tier: 1, ramp_pos: 3, twist: "converge to a target sum using sortedness", tracks: ["google_focused"] }
    - { lc_num: 11,  name: "Container With Most Water",          slug: "container-with-most-water",          url: "https://leetcode.com/problems/container-with-most-water/",          difficulty: Medium, tier: 2, ramp_pos: 4, twist: "decision rule: always move the *shorter* pointer inward", tracks: ["google_focused"] }
    - { lc_num: 15,  name: "3Sum",                                slug: "3sum",                                url: "https://leetcode.com/problems/3sum/",                                difficulty: Medium, tier: 2, ramp_pos: 5, twist: "outer fix + inner two-pointer; dedup at both levels", tracks: ["google_focused"] }
    - { lc_num: 42,  name: "Trapping Rain Water",                 slug: "trapping-rain-water",                 url: "https://leetcode.com/problems/trapping-rain-water/",                 difficulty: Hard,   tier: 3, ramp_pos: 6, twist: "carry max-so-far state on each pointer; smaller side dictates fill", tracks: ["google_focused"] }

# =============================================================================
# 3. SLIDING WINDOW
# =============================================================================
# Pedagogical arc:
#   shrink-when-exceeds → set/map state inside window
#   → count-budget invariant → same-budget variant
#   → fixed-size + freq equality → all-positions variant
#   → invariant len − max_freq ≤ k → k-distinct generalisation
#   → full state shrink/grow → monotonic deque inside window
sliding_window:
  section_order: 3
  problems:
    - { lc_num: 209,  name: "Minimum Size Subarray Sum",                            slug: "minimum-size-subarray-sum",                            url: "https://leetcode.com/problems/minimum-size-subarray-sum/",                            difficulty: Medium, tier: 1, ramp_pos: 1,  twist: "primer: shrink window from the left while constraint still met", tracks: [] }
    - { lc_num: 3,    name: "Longest Substring Without Repeating Characters",       slug: "longest-substring-without-repeating-characters",       url: "https://leetcode.com/problems/longest-substring-without-repeating-characters/",       difficulty: Medium, tier: 1, ramp_pos: 2,  twist: "maintain set/map of chars inside the window", tracks: ["google_focused"] }
    - { lc_num: 1004, name: "Max Consecutive Ones III",                              slug: "max-consecutive-ones-iii",                              url: "https://leetcode.com/problems/max-consecutive-ones-iii/",                              difficulty: Medium, tier: 2, ramp_pos: 3,  twist: "window invariant is a *count budget* (zero count ≤ k)", tracks: [] }
    - { lc_num: 1493, name: "Longest Subarray of 1s After Deleting One Element",    slug: "longest-subarray-of-1s-after-deleting-one-element",    url: "https://leetcode.com/problems/longest-subarray-of-1s-after-deleting-one-element/",    difficulty: Medium, tier: 2, ramp_pos: 4,  twist: "same budget shape with k=1; must-delete-one edge case", tracks: [] }
    - { lc_num: 567,  name: "Permutation in String",                                  slug: "permutation-in-string",                                  url: "https://leetcode.com/problems/permutation-in-string/",                                  difficulty: Medium, tier: 2, ramp_pos: 5,  twist: "fixed-size window + frequency-map equality check", tracks: ["google_focused"] }
    - { lc_num: 438,  name: "Find All Anagrams in a String",                          slug: "find-all-anagrams-in-a-string",                          url: "https://leetcode.com/problems/find-all-anagrams-in-a-string/",                          difficulty: Medium, tier: 2, ramp_pos: 6,  twist: "same comparison; report *every* matching start position", tracks: ["google_focused"] }
    - { lc_num: 424,  name: "Longest Repeating Character Replacement",                slug: "longest-repeating-character-replacement",                url: "https://leetcode.com/problems/longest-repeating-character-replacement/",                difficulty: Medium, tier: 2, ramp_pos: 7,  twist: "invariant: (window length − max char freq) ≤ k", tracks: ["google_focused"] }
    - { lc_num: 904,  name: "Fruit Into Baskets",                                     slug: "fruit-into-baskets",                                     url: "https://leetcode.com/problems/fruit-into-baskets/",                                     difficulty: Medium, tier: 2, ramp_pos: 8,  twist: "k-distinct generalisation with k=2", tracks: [] }
    - { lc_num: 76,   name: "Minimum Window Substring",                               slug: "minimum-window-substring",                               url: "https://leetcode.com/problems/minimum-window-substring/",                               difficulty: Hard,   tier: 3, ramp_pos: 9,  twist: "full state-driven shrink/grow with target-satisfaction counter", tracks: ["google_focused"] }
    - { lc_num: 239,  name: "Sliding Window Maximum",                                 slug: "sliding-window-maximum",                                 url: "https://leetcode.com/problems/sliding-window-maximum/",                                 difficulty: Hard,   tier: 3, ramp_pos: 10, twist: "monotonic deque INSIDE the window — composite pattern", tracks: ["google_focused"] }

# =============================================================================
# 4. PREFIX SUM
# =============================================================================
# Pedagogical arc:
#   prefix balance + first-seen index → prefix sum + count map
#   → modular variant → reframe odd-count as prefix sum → 2D prefix
prefix_sum:
  section_order: 4
  problems:
    - { lc_num: 525,  name: "Contiguous Array",                       slug: "contiguous-array",                       url: "https://leetcode.com/problems/contiguous-array/",                       difficulty: Medium, tier: 1, ramp_pos: 1, twist: "map prefix balance (+1/-1) to first-seen index", tracks: ["google_focused"] }
    - { lc_num: 560,  name: "Subarray Sum Equals K",                  slug: "subarray-sum-equals-k",                  url: "https://leetcode.com/problems/subarray-sum-equals-k/",                  difficulty: Medium, tier: 1, ramp_pos: 2, twist: "prefix sum + count map of prior prefixes", tracks: ["google_focused"] }
    - { lc_num: 974,  name: "Subarray Sums Divisible by K",           slug: "subarray-sums-divisible-by-k",           url: "https://leetcode.com/problems/subarray-sums-divisible-by-k/",           difficulty: Medium, tier: 2, ramp_pos: 3, twist: "modular variant — bucket prefixes by (sum mod k)", tracks: [] }
    - { lc_num: 1248, name: "Count Number of Nice Subarrays",         slug: "count-number-of-nice-subarrays",         url: "https://leetcode.com/problems/count-number-of-nice-subarrays/",         difficulty: Medium, tier: 2, ramp_pos: 4, twist: "reframe 'exactly k odd' as a prefix-count problem", tracks: [] }
    - { lc_num: 304,  name: "Range Sum Query 2D — Immutable",          slug: "range-sum-query-2d-immutable",            url: "https://leetcode.com/problems/range-sum-query-2d-immutable/",          difficulty: Medium, tier: 2, ramp_pos: 5, twist: "2D prefix sum with inclusion–exclusion at query time", tracks: [] }

# =============================================================================
# 5. BINARY SEARCH
# =============================================================================
# Pedagogical arc:
#   plain BS → 2D as flat → rotated discontinuity → which-half-sorted
#   → neighbour-compare → BS for largest ≤ x
#   → BS on answer (intro / variant / hard) → partition-based BS
binary_search:
  section_order: 5
  problems:
    - { lc_num: 704,  name: "Binary Search",                                      slug: "binary-search",                                      url: "https://leetcode.com/problems/binary-search/",                                      difficulty: Easy,   tier: 1, ramp_pos: 1,  twist: "primer: half-the-range invariant", tracks: ["google_focused"] }
    - { lc_num: 74,   name: "Search a 2D Matrix",                                  slug: "search-a-2d-matrix",                                  url: "https://leetcode.com/problems/search-a-2d-matrix/",                                  difficulty: Medium, tier: 1, ramp_pos: 2,  twist: "treat 2D as a flat sorted array via index arithmetic", tracks: [] }
    - { lc_num: 153,  name: "Find Minimum in Rotated Sorted Array",                slug: "find-minimum-in-rotated-sorted-array",                url: "https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/",                difficulty: Medium, tier: 2, ramp_pos: 3,  twist: "compare to right end to locate the discontinuity", tracks: ["google_focused"] }
    - { lc_num: 33,   name: "Search in Rotated Sorted Array",                       slug: "search-in-rotated-sorted-array",                      url: "https://leetcode.com/problems/search-in-rotated-sorted-array/",                      difficulty: Medium, tier: 2, ramp_pos: 4,  twist: "decide which half is sorted, then check if target lies there", tracks: ["google_focused"] }
    - { lc_num: 162,  name: "Find Peak Element",                                    slug: "find-peak-element",                                    url: "https://leetcode.com/problems/find-peak-element/",                                    difficulty: Medium, tier: 2, ramp_pos: 5,  twist: "no target value — neighbour comparison drives the BS", tracks: [] }
    - { lc_num: 981,  name: "Time Based Key-Value Store",                            slug: "time-based-key-value-store",                            url: "https://leetcode.com/problems/time-based-key-value-store/",                            difficulty: Medium, tier: 2, ramp_pos: 6,  twist: "BS for the largest value ≤ x (lower_bound minus 1)", tracks: [] }
    - { lc_num: 875,  name: "Koko Eating Bananas",                                   slug: "koko-eating-bananas",                                   url: "https://leetcode.com/problems/koko-eating-bananas/",                                   difficulty: Medium, tier: 2, ramp_pos: 7,  twist: "BS on the *answer space* using a monotone feasibility check", tracks: ["google_focused"] }
    - { lc_num: 1011, name: "Capacity To Ship Packages Within D Days",                slug: "capacity-to-ship-packages-within-d-days",                url: "https://leetcode.com/problems/capacity-to-ship-packages-within-d-days/",                difficulty: Medium, tier: 2, ramp_pos: 8,  twist: "same answer-space BS with a different feasibility predicate", tracks: ["google_focused"] }
    - { lc_num: 410,  name: "Split Array Largest Sum",                                slug: "split-array-largest-sum",                                url: "https://leetcode.com/problems/split-array-largest-sum/",                                difficulty: Hard,   tier: 3, ramp_pos: 9,  twist: "hard answer-space BS; feasibility is a greedy partition", tracks: [] }
    - { lc_num: 4,    name: "Median of Two Sorted Arrays",                            slug: "median-of-two-sorted-arrays",                            url: "https://leetcode.com/problems/median-of-two-sorted-arrays/",                            difficulty: Hard,   tier: 3, ramp_pos: 10, twist: "partition-based BS on the smaller array — not search-for-value", tracks: ["google_focused"] }

# =============================================================================
# 6. STACK & MONOTONIC STACK
# =============================================================================
# Pedagogical arc:
#   matched pairs → auxiliary state per push → stack as evaluator
#   → nested stack of (count, str) → push-time collision resolution
#   → monotonic stack primer → standard NGE pattern → sort + monotonic
#   → histogram capstone
stack_and_monotonic:
  section_order: 6
  problems:
    - { lc_num: 20,  name: "Valid Parentheses",                       slug: "valid-parentheses",                       url: "https://leetcode.com/problems/valid-parentheses/",                       difficulty: Easy,   tier: 1, ramp_pos: 1, twist: "primer: LIFO matched-pairs check", tracks: ["google_focused"] }
    - { lc_num: 155, name: "Min Stack",                                slug: "min-stack",                                url: "https://leetcode.com/problems/min-stack/",                                difficulty: Medium, tier: 1, ramp_pos: 2, twist: "augment each push with auxiliary state (running min)", tracks: ["google_focused"] }
    - { lc_num: 150, name: "Evaluate Reverse Polish Notation",         slug: "evaluate-reverse-polish-notation",         url: "https://leetcode.com/problems/evaluate-reverse-polish-notation/",         difficulty: Medium, tier: 1, ramp_pos: 3, twist: "stack as an expression evaluator", tracks: [] }
    - { lc_num: 394, name: "Decode String",                            slug: "decode-string",                            url: "https://leetcode.com/problems/decode-string/",                            difficulty: Medium, tier: 2, ramp_pos: 4, twist: "nested stack of (multiplier, accumulated-string) frames", tracks: ["google_focused"] }
    - { lc_num: 735, name: "Asteroid Collision",                       slug: "asteroid-collision",                       url: "https://leetcode.com/problems/asteroid-collision/",                       difficulty: Medium, tier: 2, ramp_pos: 5, twist: "resolve collisions at push time via while-pop loop", tracks: [] }
    - { lc_num: 496, name: "Next Greater Element I",                    slug: "next-greater-element-i",                    url: "https://leetcode.com/problems/next-greater-element-i/",                    difficulty: Easy,   tier: 2, ramp_pos: 6, twist: "primer for monotonic stack — pop while top ≤ current", tracks: ["google_focused"] }
    - { lc_num: 739, name: "Daily Temperatures",                        slug: "daily-temperatures",                        url: "https://leetcode.com/problems/daily-temperatures/",                        difficulty: Medium, tier: 2, ramp_pos: 7, twist: "monotonic stack storing *indices* to compute waiting days", tracks: ["google_focused"] }
    - { lc_num: 853, name: "Car Fleet",                                 slug: "car-fleet",                                 url: "https://leetcode.com/problems/car-fleet/",                                 difficulty: Medium, tier: 2, ramp_pos: 8, twist: "sort by position, then monotonic stack on arrival times", tracks: [] }
    - { lc_num: 84,  name: "Largest Rectangle in Histogram",            slug: "largest-rectangle-in-histogram",            url: "https://leetcode.com/problems/largest-rectangle-in-histogram/",            difficulty: Hard,   tier: 3, ramp_pos: 9, twist: "monotonic stack capstone — width derived from popped neighbours", tracks: ["google_focused"] }

# =============================================================================
